name: Deploy QA Report to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  qa-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Playwright OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run QA comparison
        id: qa
        run: npm run qa
        continue-on-error: true

      - name: Locate latest report
        id: report
        run: |
          LATEST_DIR=$(ls -1t reports | head -n 1)
          echo "리포트 폴더: reports/$LATEST_DIR"
          echo "dir=reports/$LATEST_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.report.outputs.dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail workflow if QA found differences
        if: steps.qa.outcome == 'failure'
        run: exit 1
